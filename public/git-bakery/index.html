    <style>
      body {
        margin: 0;
      }
      img {
        max-width: 100%;
      }
      /* Layout: the map is itself a commit graph (chapters = lines, levels = stations); play = mission rail + board (graph / three trays / terminal) */
      :root {
        --bg: #faf9f5;
        --card: #fdfcf8;
        --surface: #f1efe7;
        --line: #e8e6dc;
        --line-strong: #d4d1c4;
        --ink: #141413;
        --muted: #6c6a62;
        --faint: #b0aea5;
        --orange: #d97757;
        --blue: #6a9bcc;
        --green: #788c5d;
        --orange-ink: #b65b3d;
        --blue-ink: #3f6c99;
        --green-ink: #56683f;
        --on-accent: #faf9f5;
        --term-bg: #141413;
        --term-fg: #ebe8de;
        --term-dim: #8e8b81;
        --term-line: #2b2a27;
        --t-ok: #a9bd8c;
        --t-warn: #eb9675;
        --t-note: #93bbe2;
        --t-hash: #e9b07f;
        --font-heading:
          "Poppins", "Noto Sans JP", "Hiragino Sans", Arial, sans-serif;
        --font-body:
          "Lora", "Noto Serif JP", "Hiragino Mincho ProN", Georgia, serif;
        --font-mono:
          "JetBrains Mono", "Noto Sans JP", ui-monospace, Menlo, monospace;
        --r: 10px;
        --pattern: url(/git-bakery/assets/pattern-wheat.webp);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141413;
          --card: #1a1a18;
          --surface: #201f1d;
          --line: #2d2c28;
          --line-strong: #3d3b36;
          --ink: #f0eee6;
          --muted: #a3a097;
          --faint: #5f5d56;
          --orange-ink: #ec9a7b;
          --blue-ink: #94bce4;
          --green-ink: #a5b98a;
          --on-accent: #141413;
          --term-bg: #0f0f0e;
          --term-line: #262522;
          --pattern: none;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141413;
        --card: #1a1a18;
        --surface: #201f1d;
        --line: #2d2c28;
        --line-strong: #3d3b36;
        --ink: #f0eee6;
        --muted: #a3a097;
        --faint: #5f5d56;
        --orange-ink: #ec9a7b;
        --blue-ink: #94bce4;
        --green-ink: #a5b98a;
        --on-accent: #141413;
        --term-bg: #0f0f0e;
        --term-line: #262522;
        --pattern: none;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-heading);
        font-size: 16px;
        line-height: 1.65;
      }
      /* wheat texture kept barely visible: it is atmosphere, not decoration */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: var(--pattern);
        background-size: 620px 620px;
        opacity: 0.28;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 2px;
      }
      code,
      kbd {
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .top {
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .top .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-block: 12px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 900;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .logo svg {
        flex: none;
      }
      .score {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 14.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .score img {
        width: 22px;
        height: 22px;
      }
      .score b {
        color: var(--orange-ink);
        font-weight: 600;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-strong);
        background: var(--card);
        border-radius: 999px;
        padding: 10px 20px;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 16px;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--orange);
        border-color: var(--orange);
        color: var(--on-accent);
      }
      .btn.primary:hover {
        filter: brightness(1.05);
      }
      .btn.small {
        padding: 8px 16px;
        font-size: 15px;
      }

      /* ---------- map ---------- */
      .hero {
        padding-block: 24px 8px;
        display: grid;
        gap: 18px;
      }
      /* the shop scene stays a lit morning room in both themes, so it pins its own light tokens */
      .scene {
        --ink: #141413;
        --muted: #5d5b54;
        --card: #fdfcf8;
        --line: #e8e6dc;
        --line-strong: #d4d1c4;
        --orange-ink: #b65b3d;
        --on-accent: #faf9f5;
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        min-height: clamp(440px, 44vw, 560px);
        display: grid;
        align-items: center;
        background: #f6efe0;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .scene > .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right center;
      }
      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          90deg,
          rgba(250, 249, 245, 0.95) 0%,
          rgba(250, 249, 245, 0.86) 36%,
          rgba(250, 249, 245, 0.25) 58%,
          rgba(250, 249, 245, 0) 70%
        );
      }
      .hero-copy {
        position: relative;
        z-index: 2;
        padding: 40px clamp(24px, 4.5vw, 60px);
        max-width: 700px;
      }
      .hero h1 {
        font-size: clamp(2.2rem, 4.4vw, 3.7rem);
        font-weight: 900;
        line-height: 1.1;
        margin: 10px 0 16px;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .hero .lead {
        font-family: var(--font-body);
        font-size: 18px;
        line-height: 1.9;
        max-width: 30em;
        margin: 0 0 24px;
        color: var(--ink);
      }
      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .welcome {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        gap: 18px;
        align-items: stretch;
      }
      .greet {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .greet img {
        width: 132px;
        height: 132px;
        object-fit: contain;
        animation: sway 4s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .bubble {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        padding: 12px 16px;
      }
      .bubble::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 26px;
        width: 14px;
        height: 14px;
        background: var(--card);
        border-left: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
        transform: rotate(45deg);
      }
      .bubble .who {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--orange-ink);
        margin-bottom: 2px;
      }
      .bubble p {
        margin: 0;
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.85;
      }
      .prog {
        margin-top: 26px;
        max-width: 420px;
      }
      .prog .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .prog .bar i {
        display: block;
        height: 100%;
        background: var(--orange);
        border-radius: 3px;
      }
      .prog p {
        margin: 8px 0 0;
        font-size: 15px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .howto {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        padding: 16px 20px 18px;
        display: grid;
        gap: 12px;
      }
      .howto h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 900;
        text-wrap: balance;
      }
      .howto ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .howto li {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 3px;
      }
      .howto li + li::before {
        content: "→";
        position: absolute;
        left: -13px;
        top: 26px;
        color: var(--faint);
        font-weight: 700;
      }
      .howto img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .howto b {
        font-size: 17px;
      }
      .howto span {
        font-size: 14.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .howto code {
        font-size: 13px;
        background: var(--surface);
        border-radius: 5px;
        padding: 1px 7px;
        color: var(--orange-ink);
        margin-top: 2px;
      }
      .howto p {
        margin: 0;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--muted);
        line-height: 1.75;
      }

      .section-h {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin: 0 0 18px;
      }
      .section-h h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 900;
      }
      .section-h p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      .chapters {
        display: grid;
        gap: 14px;
        padding-bottom: 40px;
      }
      .chapter {
        --lane: var(--orange);
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: 24px;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }
      .chapter header {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .ch-art {
        width: 78px;
        height: 78px;
        object-fit: contain;
      }
      .chapter[data-ch="2"] {
        --lane: var(--blue);
      }
      .chapter[data-ch="3"] {
        --lane: var(--green);
      }
      .chapter[data-ch="4"] {
        --lane: var(--ink);
      }
      .chapter .chno {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .chapter h3 {
        margin: 2px 0 4px;
        font-size: 22px;
        font-weight: 900;
      }
      .chapter p {
        margin: 0;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--muted);
        line-height: 1.7;
      }
      .stations {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        position: relative;
      }
      .stations::before {
        content: "";
        position: absolute;
        left: calc(100% / var(--n) / 2);
        right: calc(100% / var(--n) / 2);
        top: 26px;
        height: 4px;
        border-radius: 2px;
        background: var(--lane);
      }
      .st {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        padding: 0 4px 6px;
        border-radius: 8px;
        position: relative;
        text-align: center;
      }
      .st .bread {
        width: 54px;
        height: 54px;
        object-fit: contain;
        transition: transform 0.2s;
        filter: drop-shadow(0 3px 2px rgba(80, 50, 20, 0.18));
      }
      .st:not(.cleared) .bread {
        opacity: 0.9;
      }
      .st.next .bread {
        animation: bob 1.6s ease-in-out infinite;
      }
      .st:hover .bread {
        transform: scale(1.14) rotate(-6deg);
      }
      .st.next .name::after {
        content: "次はここ";
        display: block;
        color: var(--orange-ink);
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 13px;
      }
      .st .no {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .st .name {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        text-wrap: balance;
      }
      .stars {
        font-size: 14px;
        letter-spacing: 1px;
        color: var(--faint);
      }
      .stars .on {
        color: var(--orange);
      }

      .zukan {
        padding-block: 12px 56px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
      }
      .cmdcard {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px 14px;
        background: var(--card);
      }
      .cmdcard img {
        width: 34px;
        height: 34px;
      }
      .cmdcard.locked img {
        opacity: 0.7;
      }
      .cmdcard code {
        display: block;
        font-weight: 600;
        color: var(--orange-ink);
        margin-bottom: 4px;
        font-size: 15px;
      }
      .cmdcard p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .cmdcard.locked {
        background: transparent;
        border-style: dashed;
      }
      .cmdcard.locked code {
        color: var(--faint);
      }
      .foot {
        border-top: 1px solid var(--line);
        padding-block: 20px 36px;
        color: var(--muted);
        font-size: 14px;
        font-family: var(--font-body);
      }

      /* ---------- play ---------- */
      .play {
        display: grid;
        grid-template-columns: minmax(0, 370px) minmax(0, 1fr);
        gap: 20px;
        padding-block: 18px 40px;
        align-items: start;
      }
      .mission {
        display: grid;
        gap: 16px;
        position: sticky;
        top: 12px;
      }
      .crumb {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 15px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .crumb a {
        text-decoration: none;
        font-weight: 700;
        color: var(--ink);
      }
      .crumb a:hover {
        color: var(--orange-ink);
      }
      .mission h1 {
        margin: 0;
        font-size: 27px;
        line-height: 1.35;
        font-weight: 900;
        text-wrap: balance;
      }
      .mission h1 .lvno {
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: 600;
        color: var(--orange-ink);
        display: block;
        margin-bottom: 2px;
      }
      .story {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.85;
        margin: 0;
      }
      .boss {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .boss > img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-top: 4px;
      }
      .boss .bubble {
        padding: 10px 14px;
      }
      .boss .bubble::before {
        top: 22px;
      }
      .lbl {
        font-size: 14px;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin: 0 0 8px;
        font-weight: 700;
      }
      .goals {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .goal {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        font-size: 16px;
        line-height: 1.55;
      }
      .goal .chk {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--line-strong);
        margin-top: 1px;
        display: grid;
        place-items: center;
      }
      .goal .chk svg {
        opacity: 0;
      }
      .goal.done .chk {
        background: var(--green);
        border-color: var(--green);
      }
      .goal.done .chk svg {
        opacity: 1;
      }
      .goal.done span:last-child {
        color: var(--muted);
      }
      .goal.just .chk {
        animation: pop 0.45s ease;
      }
      .meter {
        display: flex;
        gap: 16px;
        font-size: 14.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        flex-wrap: wrap;
      }
      .meter b {
        color: var(--ink);
        font-family: var(--font-mono);
      }
      .hints {
        margin: 8px 0 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
        font-size: 15.5px;
        font-family: var(--font-body);
        line-height: 1.7;
      }
      .hints code {
        background: var(--surface);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--line-strong);

    <script id="engine">
      "use strict";
      /* ================= Git simulator ================= */
      const C = {
        index: "見出し「こむぎ堂へようこそ」",
        style: "背景はクリーム色、文字はこげ茶",
        news: "お知らせ: 10月の定休日は火曜日",
        menu: "メニュー: 食パン / クロワッサン / あんパン",
      };
      const TOUCH = {
        "menu.html": C.menu,
        "melon.html": "メロンパン: 外はさっくり、中はふんわり",
        "croissant.html": "クロワッサン特集: バターたっぷりの 3 種",
        "order.html": "予約フォーム: お名前 / 受け取り日 / 個数",
        "about.html": "店主あいさつ: 毎朝 4 時から生地を仕込んでいます",
        "banner.html": "季節限定バナー: 栗あんパン",
      };
      const ORIGIN = "github.com:komugido/site.git";
      const NOCOUNT =
        /^(help|hint|clear|ls|pwd|cat\b|git\s+(status|log|diff|show|remote|stash\s+list|--version|version|branch(\s+-[ar])?\s*$))/;

      function newRepo(salt) {
        return {
          salt: salt || 1,
          seq: 0,
          store: {},
          inited: false,
          work: {},
          index: {},
          branches: {},
          branchOrder: [],
          head: null,
          upstream: {},
          tracking: {},
          merging: null,
          stash: [],
          remote: null,
          known: new Set(),
          ran: [],
          editCount: {},
          prevBranch: null,
        };
      }
      function hid(r) {
        r.seq++;
        let x = (Math.imul(r.seq, 2654435761) ^ Math.imul(r.salt, 40503)) >>> 0;
        x ^= x >>> 15;
        x = Math.imul(x, 0x2c1b3c6d) >>> 0;
        x ^= x >>> 12;
        x = Math.imul(x, 0x297a2d39) >>> 0;
        x ^= x >>> 15;
        return (x >>> 0).toString(16).padStart(8, "0").slice(0, 7);
      }
      function mkCommit(r, parents, tree, msg, local = true) {
        let id;
        do {
          id = hid(r);
        } while (r.store[id]);
        r.store[id] = {
          id,
          parents: parents.slice(),
          tree: { ...tree },
          msg,
          seq: r.seq,
        };
        if (local) r.known.add(id);
        return id;
      }
      const headId = r =>
        !r.head
          ? null
          : r.head.b !== undefined
            ? r.branches[r.head.b] || null
            : r.head.d;
      const treeOf = (r, id) => (id ? r.store[id].tree : {});
      const headTree = r => treeOf(r, headId(r));
      const files = (...objs) =>

    <script>

      /* ---------- graph ---------- */
      const LANE = [
        "var(--orange)",
        "var(--blue)",
        "var(--green)",
        "var(--faint)",
      ];
      function graphSVG(r, mode, prev) {
        const refs = [];
        if (mode === "remote") {
          Object.keys(r.remote.branches)
            .sort((a, b) =>
              a === "main" ? -1 : b === "main" ? 1 : a.localeCompare(b)
            )
            .forEach(b =>
              refs.push({ n: b, id: r.remote.branches[b], k: "rb" })
            );
        } else {
          for (const b of r.branchOrder)
            if (r.branches[b])
              refs.push({
                n: b,
                id: r.branches[b],
                k: "b",
                cur: r.head && r.head.b === b,
              });
          if (r.head && r.head.d)
            refs.push({ n: "HEAD", id: r.head.d, k: "h" });
          Object.keys(r.tracking)
            .sort()
            .forEach(k => refs.push({ n: k, id: r.tracking[k], k: "t" }));
        }
        const seeds = refs.map(x => x.id);
        if (mode === "local" && r.merging) seeds.push(r.merging.head);
        const vis = new Set();
        seeds.forEach(s => ancestors(r, s).forEach(x => vis.add(x)));
        if (!vis.size) return null;
        const list = [...vis].sort((a, b) => r.store[a].seq - r.store[b].seq);
        const lane = {};
        let n = 0;
        const chain = id => {
          if (lane[id] !== undefined) return;
          const L = n++;
          let c = id;
          while (c && lane[c] === undefined) {
            lane[c] = L;
            c = r.store[c].parents[0];
          }
        };
        refs.forEach(x => chain(x.id));
        [...list].reverse().forEach(chain);
        const hasT = refs.some(x => x.k === "t");
        const DX = 88,
          DY = hasT ? 102 : 72,
          PX = 44,
          TOP = 46;
        const pos = {};
        list.forEach((id, i) => {
          pos[id] = { x: PX + i * DX, y: TOP + lane[id] * DY };
        });
        const W = PX * 2 + (list.length - 1) * DX + 70,
          H = TOP + (n - 1) * DY + (hasT ? 68 : 44);
        const hidv = mode === "local" ? headId(r) : null;
        let edges = "",
          nodes = "",
          labels = "";
        list.forEach(id => {
          const c = r.store[id];
          c.parents.forEach((p, pi) => {
            if (!pos[p]) return;
            const a = pos[p],
              b = pos[id],
              col = LANE[(pi === 0 ? lane[id] : lane[p]) % 4];
            const d =
              a.y === b.y
                ? `M${a.x} ${a.y}L${b.x} ${b.y}`
                : `M${a.x} ${a.y}C${a.x + DX * 0.65} ${a.y},${b.x - DX * 0.65} ${b.y},${b.x} ${b.y}`;
            edges += `<path d="${d}" stroke="${col}" class="edge${prev && !prev.has(id) ? " fresh" : ""}"/>`;
          });
        });
        let fi = 0;
        list.forEach(id => {
          const { x, y } = pos[id],
            c = r.store[id],
            fresh = prev && !prev.has(id);
          nodes +=
            `<g class="node${fresh ? " fresh" : ""}" style="--i:${fresh ? fi++ : 0}" data-id="${id}" tabindex="0" role="button" aria-label="コミット ${id} ${esc(c.msg)}"><title>${id}  ${esc(c.msg)}</title>` +
            (id === hidv
              ? `<circle cx="${x}" cy="${y}" r="15.5" class="head-ring"/>`
              : "") +
            `<circle cx="${x}" cy="${y}" r="10" fill="${LANE[lane[id] % 4]}" class="dot"/>` +
            (c.parents.length > 1
              ? `<circle cx="${x}" cy="${y}" r="3.6" class="hole"/>`
              : "") +
            `<text x="${x}" y="${y + 29}" class="cid">${id}</text></g>`;
        });
        const by = {};
        refs.forEach(x => (by[x.id] = by[x.id] || []).push(x));
        const place = (rs, cx, cy) => {
          const items = rs.map(q => {
            const t = q.cur ? `HEAD → ${q.n}` : q.n;
            return { q, t, w: t.length * 7.7 + 20 };
          });
          const total =
            items.reduce((a, i) => a + i.w, 0) + (items.length - 1) * 4;
          let sx = Math.max(4, cx - total / 2);
          items.forEach(({ q, t, w }) => {
            const cls = q.cur
              ? "cur"
              : q.k === "b"
                ? "br"
                : q.k === "h"
                  ? "head"
                  : q.k === "t"
                    ? "tr"
                    : "rb";
            labels += `<g class="ref ${cls}"><rect x="${sx}" y="${cy - 11}" width="${w}" height="22" rx="11"/><text x="${sx + w / 2}" y="${cy}">${esc(t)}</text></g>`;
            sx += w + 4;
          });
        };
        Object.entries(by).forEach(([id, rs]) => {
          const { x, y } = pos[id];
          const top = rs.filter(q => q.k !== "t"),
            bot = rs.filter(q => q.k === "t");
          if (top.length) place(top, x, y - 29);
          if (bot.length) place(bot, x, y + 50);
        });
        return {
          svg: `<svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="コミットグラフ">${edges}${nodes}${labels}</svg>`,
          ids: new Set(list),
        };
      }

      </div>
    </section>
    <section class="chapters" aria-label="レベル">
      ${CHAPTERS.map(ch => {
        const lvs = LEVELS.filter(l => l.ch === ch.no);
        return `<div class="chapter" data-ch="${ch.no}">
          <header><img class="ch-art" src="${A}${CH_ART[ch.no]}.webp" alt="" width="78" height="78" loading="lazy"><div><span class="chno">CHAPTER ${ch.no}</span><h3>${esc(ch.title)}</h3><p>${esc(ch.desc)}</p></div></header>
          <ol class="stations" style="--n:${lvs.length}">${lvs
            .map(l => {
              const p = PROG.lv[l.id];
              return `<li><a class="st${p ? " cleared" : ""}${l === next && !p ? " next" : ""}" href="#lv-${l.id}" aria-label="${l.id} ${esc(l.title)}${p ? "（クリア済み）" : ""}"><img class="bread" src="${A}${p ? "bun" : "dough"}.webp" alt="" width="54" height="54" loading="lazy"><span class="no">${l.id}</span><span class="name">${esc(l.title)}</span><span class="stars">${starsHTML(p ? p.stars : 0)}</span></a></li>`;
            })
            .join("")}</ol></div>`;
      }).join("")}
    </section>
    <section class="zukan">
      <div class="section-h"><h2>コマンド図鑑</h2><p>レベルを焼き上げると集まります。${COMMANDS.filter(c => PROG.lv[c[2]]).length} / ${COMMANDS.length}</p></div>
      <div class="cards">${COMMANDS.map(([c, d, lv]) =>
        PROG.lv[lv]
          ? `<div class="cmdcard"><img src="${A}bun.webp" alt="" width="34" height="34" loading="lazy"><div><code>${esc(c)}</code><p>${esc(d)}</p></div></div>`
          : `<div class="cmdcard locked"><img src="${A}dough.webp" alt="" width="34" height="34" loading="lazy"><div><code>？？？</code><p>${lv} をクリアで解放</p></div></div>`
      ).join("")}</div>
    </section>
  </div>
  <footer class="foot"><div class="wrap">このゲームの git は学習用の再現で、よく使う動きに絞っています。touch と edit は、ファイルを作る・エディタで書き換える操作の代わりです。進み具合はこのブラウザに保存されます。</div></footer>`;
        renderScore();
        window.scrollTo(0, 0);
      }

      /* ---------- play ---------- */
      const ARROW =
        '<svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M1 6H19M14 1L20 6L14 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const CHECK =
        '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2L5 8.6L9.6 3.6" fill="none" stroke="#faf9f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      function startLevel(lv) {
        closeModal();
        const r = newRepo(hashStr(lv.id)),
          s = makeSetup(r);
        lv.setup(s);
        r.ran = [];
        const hist = G ? G.hist : [];
        G = {
          lv,
          r,
          ctx: s.ctx,
          count: 0,
          hints: 0,
          done: false,
          hist,
          hi: hist.length,
          prev: { local: new Set(), remote: new Set() },
          goalState: [],
        };
        const ch = CHAPTERS.find(c => c.no === lv.ch);
        view.innerHTML = `
  <div class="wrap"><div class="play">
    <aside class="mission">
      <div class="crumb"><a href="#map">← マップ</a><span>${ch ? `第${ch.no}章 ${esc(ch.title)}` : "サンドボックス"}</span></div>
      <h1><span class="lvno">${lv.id === "sandbox" ? "SANDBOX" : "LEVEL " + lv.id}</span>${esc(lv.title)}</h1>
      <div class="boss"><img src="${A}mascot-baker.webp" alt="店長のこむぎ" width="72" height="72"><div class="bubble"><span class="who">店長 こむぎ</span><p class="story">${esc(lv.story)}</p></div></div>
      ${
        lv.goals.length
          ? `<div><h2 class="lbl">ゴール</h2><ul class="goals" id="goals"></ul></div>
      <div class="meter"><span>手数 <b id="cnt">0</b></span><span>お手本 <b>${parOf(lv)}</b> 手</span><span>ヒント <b id="hcnt">0</b> / ${lv.hints.length}</span></div>
      <div><button class="btn small" id="hintBtn" type="button">ヒントを見る</button><ol class="hints" id="hints"></ol></div>`
          : `<div class="side-actions"><button class="btn small" id="hanaBtn" type="button">ハナさんが push する</button></div>`
      }
      <div><h2 class="lbl">道具箱（押すと入力欄に入ります）</h2><div class="tools">${lv.tools.map(t => `<button class="chip" type="button" data-ins="${esc(t.includes("<") ? t.slice(0, t.indexOf("<")) : t)}">${esc(t)}</button>`).join("")}</div></div>
      <div class="side-actions"><button class="linkbtn" id="resetBtn" type="button">最初からやり直す</button>${lv.id !== "sandbox" ? "" : ""}</div>
    </aside>
    <section class="board">
      <div class="panel">
        <div class="panel-h"><span>コミットグラフ　あなたの PC</span><span class="legend"><span><i class="lg-dot"></i>記録（コミット）</span><span><i class="lg-ref"></i>枝の名前（ブランチ）</span>${lv.ch === 4 || lv.id === "sandbox" || lv.id === "3-5" ? '<span><i class="lg-tr"></i>最後に見た origin の位置</span>' : ""}</span></div>
        <div class="graph-scroll" id="gLocal"></div>
        <div class="remote-part" id="gRemoteWrap" hidden><div class="panel-h"><span>origin（GitHub 上の共有リポジトリ）</span></div><div class="graph-scroll" id="gRemote"></div></div>
      </div>
      <div class="zones" id="zones"></div>
      <div class="term">
        <div class="term-bar"><span>ターミナル</span><span class="keys">help でコマンド一覧 · ↑↓ で履歴 · Tab で補完</span></div>
        <div class="term-out" id="out" role="log" aria-live="polite"></div>
        <form id="cmdForm" autocomplete="off"><label for="cmd" id="prompt"></label><input id="cmd" name="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="コマンドを入力"><button class="runbtn" type="submit">実行</button></form>
      </div>
    </section>
  </div></div>`;
        bindPlay();
        print([
          [
            [
              `# ${lv.id === "sandbox" ? "サンドボックス" : lv.id + " " + lv.title}`,
              "sys",
            ],
          ],
          [
            [
              "# 使えるコマンドは help、行き詰まったら hint。グラフの点を押すとコミット ID が入力されます。",
              "sys",
            ],
          ],
        ]);
        renderBoard(true);
        renderScore();
        window.scrollTo(0, 0);
        if (matchMedia("(pointer: fine)").matches)
          $("#cmd").focus({ preventScroll: true });
      }
      function bindPlay() {
        const input = $("#cmd");
        $("#cmdForm").addEventListener("submit", e => {
          e.preventDefault();
          const v = input.value;
          input.value = "";
          exec(v);
        });
        input.addEventListener("keydown", e => {
          if (e.isComposing) return;
          if (e.key === "ArrowUp") {
            if (G.hi > 0) {
              G.hi--;
              input.value = G.hist[G.hi];
            }
            e.preventDefault();
          } else if (e.key === "ArrowDown") {
            if (G.hi < G.hist.length) {
              G.hi++;
              input.value = G.hist[G.hi] || "";
            }
            e.preventDefault();
          } else if (e.key === "Tab") {
            e.preventDefault();
            complete(input);
          } else if (e.key === "l" && e.ctrlKey) {
            e.preventDefault();
            $("#out").innerHTML = "";
          }
        });
        document.querySelectorAll(".chip").forEach(b =>
          b.addEventListener("click", () => {
            input.value = b.dataset.ins;
            input.focus();
          })
        );
        const hb = $("#hintBtn");
        if (hb) hb.addEventListener("click", showHint);
        const hn = $("#hanaBtn");
        if (hn) hn.addEventListener("click", hanaPush);
        $("#resetBtn").addEventListener("click", () => startLevel(G.lv));
        const onNode = e => {
          const g = e.target.closest(".node");
          if (!g) return;
          if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ")
            return;
          e.preventDefault();
          input.value =
            input.value.replace(/\s*$/, input.value.trim() ? " " : "") +
            g.dataset.id;
          input.focus();
        };
        ["gLocal", "gRemote"].forEach(id => {
          $("#" + id).addEventListener("click", onNode);
          $("#" + id).addEventListener("keydown", onNode);
        });
      }
      function promptText(r) {
        if (!r.inited) return "~/komugido $";
        const where = r.head.b !== undefined ? r.head.b : `(${r.head.d})`;
        return `~/komugido (${where}${r.merging ? "|MERGING" : ""}) $`;
      }
      function print(lines) {
        const out = $("#out");
        if (!out) return;
        const frag = document.createDocumentFragment();
        lines.forEach(parts => {
          const d = document.createElement("div");
          d.className = "ln";
          parts.forEach(([t, c]) => {
            const s = document.createElement("span");
            if (c) s.className = c;
            s.textContent = t;
            d.appendChild(s);
          });
          frag.appendChild(d);
        });
        out.appendChild(frag);
        out.scrollTop = out.scrollHeight;
      }
      const HELP = [
        ["Git コマンド", "sys"],
        [
          '  git init / status / add <f> / commit -m "msg" / log [--oneline] / diff [--staged] / show',
          "",
        ],
        [
          "  git branch [名前] / switch [-c] 名前 / checkout 名前 / merge 名前 / rebase 名前",
          "",
        ],
        [
          "  git restore [--staged] <f> / reset [--soft|--hard] <コミット> / revert <コミット>",
          "",
        ],
        [
          '  git commit --amend -m "msg" / stash [pop|list] / merge --abort',
          "",
        ],
        ["  git fetch / pull / push [-u origin 名前] / remote -v", ""],
        ["ファイル操作（このゲーム用）", "sys"],
        ['  ls / cat <f> / touch <f> / edit <f> ["新しい中身"] / rm <f>', ""],
        ["その他", "sys"],
        ["  hint（ヒント） / clear（画面を消す）", ""],
        [
          "コミットの指し方: HEAD, HEAD~1, HEAD~2, main, origin/main, a1b2c3d（グラフの点を押すと入力）",
          "note",
        ],
      ];
      function exec(raw) {
        const line = raw.trim().replace(/\s+/g, " ");
        if (!line) return;
        if (G.hist[G.hist.length - 1] !== line) G.hist.push(line);
        G.hi = G.hist.length;
        print([
          [
            [promptText(G.r) + " ", "pr"],
            [line, "cmd"],
          ],
        ]);
        if (line === "clear") {
          $("#out").innerHTML = "";
          return;
        }
        if (line === "help" || line === "git help" || line === "git --help") {
          print(HELP.map(h => [h]));
          return;
        }
        if (line === "hint") {
          showHint();
          return;
        }
        if (!NOCOUNT.test(line)) G.count++;
        const o = newOut();
        run(G.r, line, o);
        if (!o.failed) G.r.ran.push(line);
        print(o.lines);
        renderBoard(false);
      }
      function showHint() {
        const lv = G.lv;
        if (!lv.hints.length) {
          print([
            [
              [
                "→ サンドボックスにヒントはありません。help でコマンド一覧が見られます。",
                "note",
              ],
            ],
          ]);
          return;
        }
        if (G.hints >= lv.hints.length) {
          print([
            [["→ ヒントはこれで全部です。左の一覧を見てください。", "note"]],
          ]);
          return;
        }
        G.hints++;
        const tmp = document.createElement("div");
        tmp.innerHTML = lv.hints[G.hints - 1];
        print([[[`ヒント ${G.hints}: ${tmp.textContent}`, "note"]]]);
        renderHints();
      }
      function renderHints() {
        const ol = $("#hints");
        if (!ol) return;
        ol.innerHTML = G.lv.hints
          .slice(0, G.hints)
          .map(h => `<li>${h}</li>`)
          .join("");
        $("#hcnt").textContent = G.hints;
        const b = $("#hintBtn");
        b.textContent =
          G.hints >= G.lv.hints.length
            ? "ヒントは以上です"
            : `ヒントを見る（あと ${G.lv.hints.length - G.hints}）`;
        b.disabled = G.hints >= G.lv.hints.length;
      }
      let hanaN = 0;
      function hanaPush() {
        const r = G.r,
          tip = r.remote.branches.main,
          t = { ...r.store[tip].tree };
        hanaN++;
        t["news.txt"] = `お知らせ: ハナさんの更新 その${hanaN}`;
        r.remote.branches.main = mkCommit(
          r,
          [tip],
          t,
          `ハナ: お知らせ更新 ${hanaN}`,
          false
        );
        print([
          [
            [
              "# ハナさんが origin の main に push しました（news.txt を更新）。git fetch や git pull で受け取れます。",
              "sys",
            ],
          ],
        ]);
        renderBoard(false);
      }
      function complete(input) {
        const v = input.value,
          toks = v.split(" "),
          last = toks[toks.length - 1],
          r = G.r;
        let cands;
        if (toks.length === 1)
          cands = [
            "git",
            "touch",
            "edit",
            "cat",
            "ls",
            "rm",
            "help",
            "hint",
            "clear",
          ];
        else if (toks[0] === "git" && toks.length === 2) cands = GIT_SUBS;
        else
          cands = [
            ...Object.keys(r.work),
            ...Object.keys(r.branches),
            ...Object.keys(r.tracking),
            ...(r.remote ? ["origin"] : []),
            "HEAD",
          ];
        const m = [...new Set(cands)].filter(c => c.startsWith(last));
        if (m.length === 1) {
          toks[toks.length - 1] = m[0];
          input.value = toks.join(" ") + " ";
        } else if (m.length > 1) {
          let p = m[0];
          m.forEach(x => {
            while (!x.startsWith(p)) p = p.slice(0, -1);
          });
          if (p.length > last.length) {
            toks[toks.length - 1] = p;
            input.value = toks.join(" ");
          } else print([[[m.join("   "), "dim"]]]);
        }
      }
      function renderBoard(first) {
        const r = G.r,
          lv = G.lv;
        const gl = graphSVG(r, "local", G.prev.local);
        const el = $("#gLocal");
        el.innerHTML = gl
          ? gl.svg
          : `<div class="graph-empty">${r.inited ? "まだコミットがありません。最初のコミットを作ると、ここに点が現れます。" : "まだ Git の管理下にありません。git init から始めましょう。"}</div>`;
        if (gl) {
          G.prev.local = gl.ids;
          el.scrollLeft = el.scrollWidth;
        }
        const rw = $("#gRemoteWrap");
        if (r.remote) {
          rw.hidden = false;
          const gr = graphSVG(r, "remote", G.prev.remote),
            er = $("#gRemote");
          er.innerHTML = gr ? gr.svg : "";
          if (gr) {
            G.prev.remote = gr.ids;
            er.scrollLeft = er.scrollWidth;
          }
        } else rw.hidden = true;
        renderZones();
        $("#prompt").textContent = promptText(r);
        if (!lv.goals.length) return;
        const h = helpers(r, G.ctx);
        const states = lv.goals.map(g => {
          try {
            return !!g[1](r, h);
          } catch (e) {
            return false;
          }
        });
        $("#goals").innerHTML = lv.goals
          .map(
            (g, i) =>
              `<li class="goal${states[i] ? " done" : ""}${states[i] && !first && !G.goalState[i] ? " just" : ""}"><span class="chk">${CHECK}</span><span>${esc(g[0])}</span></li>`
          )
          .join("");
        G.goalState = states;
        $("#cnt").textContent = G.count;
        renderHints();
        if (!first && !G.done && states.every(Boolean)) {
          G.done = true;
          setTimeout(showClear, 750);
        }
      }
      function renderZones() {
        const r = G.r,
          H = headTree(r),
          st = fileStates(r),
          z = $("#zones");
        const fileRow = (f, tag, cls, extra = "") =>
          `<li class="file"><span class="fn">${esc(f)}</span>${tag ? `<span class="tag ${cls}">${tag}</span>` : ""}${extra}</li>`;
        const work = Object.keys(r.work)
          .sort()
          .map(f => {
            const s = st.find(x => x.f === f) || {};
            if (s.conflict) {
              if (isCf(r.work[f]))
                return fileRow(
                  f,
                  "衝突",
                  "cf",
                  `<span class="cfbox"><button type="button" data-run="edit ${esc(f)} --ours">自分を残す</button><button type="button" data-run="edit ${esc(f)} --theirs">相手を残す</button><button type="button" data-run="edit ${esc(f)} --both">両方残す</button></span>`
                );
              return fileRow(f, "解決済み・add 待ち", "ok");
            }
            const tag =
              s.unstaged === "untracked"
                ? ["未追跡", "new"]
                : s.unstaged === "modified"
                  ? ["変更あり", "mod"]
                  : ["", ""];
            return fileRow(
              f,
              tag[0],
              tag[1],
              `<button class="fbtn" type="button" data-run="edit ${esc(f)}">編集</button>`
            );
          });
        st.filter(s => s.unstaged === "deleted").forEach(s =>
          work.push(fileRow(s.f, "削除", "del"))
        );
        const stage = st
          .filter(s => s.staged)
          .map(s =>
            fileRow(
              s.f,
              { new: "新規", modified: "変更", deleted: "削除" }[s.staged],
              s.staged === "new"
                ? "new"
                : s.staged === "deleted"
                  ? "del"
                  : "mod"
            )
          );
        const hidv = headId(r);
        const repo = Object.keys(H)
          .sort()
          .map(f => fileRow(f, "", ""));
        const pre = r.inited
          ? ""
          : '<p class="empty">git init で使えるようになります。</p>';
        z.innerHTML = `
    <div class="zone"><header><div><h3>作業台</h3><span>作業中のファイル</span></div><img src="${A}zone-workbench.webp" alt="" width="58" height="58"></header>
      ${work.length ? `<ul>${work.join("")}</ul>` : '<p class="empty">ファイルはありません。</p>'}</div>
    <div class="arrow">${ARROW}<span>git add</span></div>
    <div class="zone stage"><header><div><h3>天板</h3><span>次に記録するもの</span></div><img src="${A}zone-tray.webp" alt="" width="58" height="58"></header>
      ${pre || (stage.length ? `<ul>${stage.join("")}</ul>` : '<p class="empty">空です。git add で乗せた変更がここに並びます。</p>')}</div>
    <div class="arrow">${ARROW}<span>git commit</span></div>
    <div class="zone"><header><div><h3>焼き上がり</h3><span>記録ずみ</span></div><img src="${A}zone-baked.webp" alt="" width="58" height="58"></header>
      ${pre || (hidv ? `<p class="headinfo">${hidv} ${esc(r.store[hidv].msg)}</p><ul>${repo.join("")}</ul>` : '<p class="empty">まだコミットがありません。</p>')}</div>`;
        z.querySelectorAll("[data-run]").forEach(b =>
          b.addEventListener("click", () => exec(b.dataset.run))
        );
      }

      /* ---------- clear modal ---------- */
      function showClear() {
        if (!G || !G.done) return;
        const lv = G.lv,
          par = parOf(lv);
        const crit = [true, G.count <= par, G.hints === 0];
        const stars = crit.filter(Boolean).length;
        const prev = PROG.lv[lv.id];
        PROG.lv[lv.id] = { stars: Math.max(stars, prev ? prev.stars : 0) };
        saveProg();
        renderScore();
        $("#mTitle").textContent =
          stars === 3 ? "最高の焼き上がり！" : "焼き上がり！";
        $("#mSub").textContent = `${lv.id} ${lv.title}`;
        $("#mStars").innerHTML = [0, 1, 2]
          .map(i =>
            i < stars
              ? `<img class="on" src="${A}bun.webp" alt="パン（星）" width="62" height="62">`
              : `<img class="off" src="${A}dough.webp" alt="生地（星なし）" width="62" height="62">`
          )
          .join("");
        const cols = [
          "var(--orange)",
          "var(--blue)",
          "var(--green)",
          "#e3b26b",
        ];
        $("#mCrumbs").innerHTML = Array.from({ length: 18 }, (_, i) => {
          const a = (i / 18) * Math.PI * 2,
            d = 110 + (i % 3) * 40;
          return `<i style="--c:${cols[i % 4]};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d * 0.7)}px"></i>`;
        }).join("");
        $("#mCrit").innerHTML = [
          `クリア`,
          `お手本の ${par} 手以内（今回 ${G.count} 手）`,
          `ヒントを使わない（今回 ${G.hints} 回）`,
        ]
          .map((t, i) => `<li class="${crit[i] ? "on" : ""}">${esc(t)}</li>`)
          .join("");
        $("#mLearn").textContent = lv.summary;
        const idx = LEVELS.indexOf(lv),
          next = LEVELS[idx + 1];
        const nb = $("#mNext");
        nb.textContent = next
          ? `次へ: ${next.id} ${next.title}`
          : "マップに戻る";
        nb.onclick = () => {
          closeModal();
          location.hash = next ? "lv-" + next.id : "map";
        };
        $("#mRetry").onclick = () => {
          closeModal();
          startLevel(lv);
        };
        $("#modal").hidden = false;
        nb.focus();
      }
      function closeModal() {
        $("#modal").hidden = true;
      }
      $("#modal").addEventListener("click", e => {
        if (e.target.id === "modal") closeModal();
      });
      $("#mMap").addEventListener("click", closeModal);
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && !$("#modal").hidden) closeModal();
      });

      /* ---------- routing ---------- */
      function route() {
        const h = location.hash.slice(1);
        if (h.startsWith("lv-")) {
          const lv = LEVELS.find(l => l.id === h.slice(3));
          if (lv) return startLevel(lv);
        }
        if (h === "sandbox") return startLevel(SANDBOX);
        showMap();
      }
      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
