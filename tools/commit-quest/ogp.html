<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* images come from public/commit-quest/assets, written there by build.mjs */
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { position:relative; background:#f6efe0; font-family:'Noto Sans JP',sans-serif; color:#141413; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:right center; }
  .fade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(250,249,245,.97) 0%,rgba(250,249,245,.92) 50%,rgba(250,249,245,.55) 68%,rgba(250,249,245,0) 82%); }
  .copy { position:absolute; left:72px; top:70px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:21px; letter-spacing:.18em; color:#5d5b54; margin:0; }
  h1 { font-size:96px; font-weight:900; line-height:1.05; margin:14px 0 18px; letter-spacing:-.01em; white-space:nowrap; }
  .sub { font-size:34px; font-weight:700; margin:0; }
  .sub b { color:#c2603f; }
  .url { position:absolute; left:72px; bottom:46px; font-family:'JetBrains Mono',monospace; font-size:22px; color:#5d5b54; }
  .graph { position:absolute; left:72px; top:356px; }
  .cat { position:absolute; left:500px; bottom:-6px; width:250px; filter:drop-shadow(0 6px 6px rgba(80,50,20,.25)); }
</style>
</head>
<body>
  <img class="bg" src="../../public/commit-quest/assets/hero-bakery.webp" alt="">
  <div class="fade"></div>
  <div class="copy">
    <p class="eyebrow">COMMIT QUEST</p>
    <h1>コミット・クエスト</h1>
    <p class="sub">Git を<b>ゲーム</b>で覚える。全 21 レベル</p>
  </div>
  <svg class="graph" width="420" height="120" viewBox="0 0 420 120">
    <path d="M14 86H400" stroke="#d97757" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M110 86C160 86 160 30 210 30H260C310 30 310 86 350 86" stroke="#6a9bcc" stroke-width="7" stroke-linecap="round" fill="none"/>
    <g fill="#d97757" stroke="#faf9f5" stroke-width="5"><circle cx="30" cy="86" r="16"/><circle cx="110" cy="86" r="16"/><circle cx="250" cy="86" r="16"/><circle cx="350" cy="86" r="16"/></g>
    <circle cx="350" cy="86" r="6" fill="#faf9f5"/>
    <g fill="#6a9bcc" stroke="#faf9f5" stroke-width="5"><circle cx="210" cy="30" r="16"/><circle cx="270" cy="30" r="16"/></g>
  </svg>
  <img class="cat" src="../../public/commit-quest/assets/mascot-baker.webp" alt="">
  <div class="url">noguchy.me/commit-quest</div>
</body>
</html>
