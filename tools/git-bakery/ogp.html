<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* images come from public/git-bakery/assets, written there by build.mjs.
     Only big type and the illustrations: the card has to read at thumbnail size. */
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { position:relative; background:#f6efe0; font-family:'Noto Sans JP',sans-serif; color:#141413; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:right center; }
  .fade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(250,249,245,.97) 0%,rgba(250,249,245,.93) 50%,rgba(250,249,245,.5) 66%,rgba(250,249,245,0) 80%); }
  .copy { position:absolute; left:70px; top:92px; }
  h1 { font-size:132px; font-weight:900; line-height:1; margin:0 0 30px; letter-spacing:-.02em; white-space:nowrap; }
  .sub { font-size:54px; font-weight:900; line-height:1.3; margin:0; }
  .sub b { color:#c2603f; }
  .cat { position:absolute; left:470px; bottom:-14px; width:300px; filter:drop-shadow(0 8px 8px rgba(80,50,20,.25)); }
  .bun { position:absolute; width:96px; filter:drop-shadow(0 5px 4px rgba(80,50,20,.25)); }
</style>
</head>
<body>
  <img class="bg" src="../../public/git-bakery/assets/hero-bakery.webp" alt="">
  <div class="fade"></div>
  <div class="copy">
    <h1>Git ベーカリー</h1>
    <p class="sub"><b>パン屋さん</b>で<br>Git を覚えよう</p>
  </div>
  <img class="bun" style="left:72px;bottom:44px" src="../../public/git-bakery/assets/dough.webp" alt="">
  <img class="bun" style="left:186px;bottom:44px" src="../../public/git-bakery/assets/bun.webp" alt="">
  <img class="bun" style="left:300px;bottom:44px" src="../../public/git-bakery/assets/bun.webp" alt="">
  <img class="cat" src="../../public/git-bakery/assets/mascot-baker.webp" alt="">
</body>
</html>
